---
layout: default
title: forest's Blog
---

{% for post in site.posts %}
    <a href="{{ post.url }}">
        <div class="post">
            <h1>{{ post.title }}</h1>
            <span>{{ post.date | date: "%Y/%m/%d" }}</span>
        </div>
    </a>
{% endfor %}
