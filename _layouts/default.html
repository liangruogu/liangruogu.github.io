<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <script>
      window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true,
            tags: 'ams'
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { 
            background-color: #fff; color: #333; 
            font-family: 'Noto Serif SC', 'Georgia', serif;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 40px;
        }

        .top { 
            display: flex; position: fixed; gap: 25px; 
            right: 200px; top: 20px; z-index: 1000;
        }
        .top > div { cursor: pointer; font-family: sans-serif; }

        .content { 
            width: 100%; padding-top: 80px;
            display: flex; flex-direction: column; align-items: center; 
        }

        .index-page .post { 
            text-align: center; width: 400px; margin-bottom: 50px;
            color: rgb(251, 182, 92); transition: color 0.6s ease; 
            cursor: pointer; user-select: none;
        }
        .index-page .post:hover { color: rgb(90, 183, 230); }
        .index-page .post > span { color: black; cursor: auto; }
        .index-page a { text-decoration: none; }

        .post-page { 
            width: 90%; max-width: 850px; text-align: left;
            font-family: 'Noto Serif SC', serif; font-size: 19px; line-height: 1.8;
        }

        .post-page h1 { 
            text-align: center;
            color: #2b5e77;
            font-size: 2.2em;
            margin-bottom: 50px;
            margin-top: 20px; 
        }

        .post-page h2, .post-page h3 { 
            text-align: left; color: #2b5e77; margin: 1.6em 0 0.8em; 
        }
        .post-page h2 { border-bottom: 1px solid #eee; padding-bottom: 8px; }

        .post-page p, .post-page ul, .post-page ol { text-align: left; margin-bottom: 1.5em; }
        
        .post-page blockquote { 
            border-left: 4px solid #2b5e77; padding: 5px 25px;
            background: #f8fbfd; font-style: italic; margin: 25px 0; 
            margin-bottom: 0px;
        }
        mjx-container { color: #000000; font-size: 105% !important; }
        pre { 
            background: #f1f4f6; padding: 15px; border-radius: 8px; 
            font-size: 16px; overflow-x: auto; margin: 20px 0;
        }
        .post-page mark {
            background-color: #fff5b1;
            color: #333;              
            padding: 0 4px;
            margin: 0 2px;
        }

        .post-page code {
            background-color: #f1f4f6;
            color: #e83e8c;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        .post-page pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }
        .post-page a {
            color: #3182ce;
            text-decoration: none;
            border-bottom: 1px solid rgba(49, 130, 206, 0.2);
            transition: all 0.3s ease;
        }

        .post-page a:hover {
            color: #2c5282;
            border-bottom: 1px solid #2c5282;
            background-color: rgba(49, 130, 206, 0.05);
        }

    @media (max-width: 768px) {
        .top {
            position: relative; 
            right: auto;
            top: 10px;
            justify-content: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .content {
            padding-top: 20px;
        }
        .post-page {
            width: 95%;
            font-size: 17px;
            line-height: 1.6;
        }

        .post-page h1 {
            font-size: 1.6em;
            margin-bottom: 30px;
        }
        mjx-container[display="true"], pre {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch; 
            max-width: 100%;
            padding: 10px;
        }

        .post-page blockquote {
            padding: 10px 15px;
            margin: 15px 0;
        }

        .index-page .post {
            width: 90%;
        }

        .post-page code {
            background-color: #f1f4f6;
            color: #e83e8c;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        .post-page pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }
        .post-page a {
            color: #3182ce;
            text-decoration: none;
            border-bottom: 1px solid rgba(49, 130, 206, 0.2);
            transition: all 0.3s ease;
        }

        .post-page a:hover {
            color: #2c5282;
            border-bottom: 1px solid #2c5282;
            background-color: rgba(49, 130, 206, 0.05);
        }
}
    </style>
</head>
<body>
    <nav class="top">
        <div onclick="window.location.assign('/')">首页</div>
        <div onclick="window.location.assign('/about.html')">关于</div>
    </nav>

    <main class="content">
        <article class="{{ page.class }}">
            {{ content }}
        </article>
    </main>
</body>
</html>
